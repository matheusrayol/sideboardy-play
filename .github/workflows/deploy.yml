name: Deploy Sideboardy Play to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Web client check & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mage.Web.Client

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: Mage.Web.Client/.nvmrc
          cache: npm
          cache-dependency-path: Mage.Web.Client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Verificar orçamento de bundle
        run: npm run size

  deploy:
    name: Deploy em play.sideboardy.app
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 55m
          script: |
            set -euo pipefail
            cd /var/www/sideboardy-play

            if [ -f ops/web/.env ]; then
              cp ops/web/.env /tmp/sideboardy-play.env.bak
            fi

            PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Commit anterior na VPS: ${PREVIOUS_SHA:-nenhum}"

            git fetch origin ${{ github.sha }}
            git reset --hard ${{ github.sha }}

            if [ -f /tmp/sideboardy-play.env.bak ]; then
              cp /tmp/sideboardy-play.env.bak ops/web/.env
              rm -f /tmp/sideboardy-play.env.bak
            fi

            COMPOSE="docker compose -p sideboardy-play -f ops/web/docker-compose.yml -f ops/web/docker-compose.proxy.yml --env-file ops/web/.env"

            NEED_FULL_BUILD=false
            NEED_WEB_BUILD=false

            if [ -z "$PREVIOUS_SHA" ] \
              || ! docker image inspect xmage-web-server:local >/dev/null 2>&1 \
              || ! docker image inspect xmage-web:local >/dev/null 2>&1; then
              NEED_FULL_BUILD=true
            elif ! git diff --quiet "$PREVIOUS_SHA" ${{ github.sha }} -- \
              pom.xml Mage Mage.Common Mage.Sets Mage.Server Mage.Server.Plugins Mage.Plugins rust \
              ops/web/Dockerfile.server ops/web/server-entrypoint.sh ops/web/backup.sh; then
              NEED_FULL_BUILD=true
            elif ! git diff --quiet "$PREVIOUS_SHA" ${{ github.sha }} -- \
              Mage.Web.Client ops/web/Dockerfile.web ops/web/Caddyfile; then
              NEED_WEB_BUILD=true
            fi

            if [ "$NEED_FULL_BUILD" = true ]; then
              echo "Alterações no servidor/cartas detectadas: reconstruindo stack completa..."
              $COMPOSE up -d --build
            elif [ "$NEED_WEB_BUILD" = true ]; then
              echo "Alterações apenas no front-end/Caddy detectadas: reconstruindo serviço web..."
              $COMPOSE up -d --build web
            else
              echo "Sem alterações de build de imagem: garantindo containers atualizados..."
              $COMPOSE up -d
            fi

            echo "Aguardando play.sideboardy.app responder HTTP 200 e xmage ficar healthy..."
            for i in $(seq 1 60); do
              WEB_CODE=$(curl -sS -o /dev/null -w '%{http_code}' https://play.sideboardy.app/ || echo "000")
              XMAGE_HEALTH=$(docker inspect -f '{{.State.Health.Status}}' sideboardy-play-xmage-1 2>/dev/null || echo "starting")
              if [ "$WEB_CODE" = "200" ] && [ "$XMAGE_HEALTH" = "healthy" ]; then
                echo "Deploy saudável (HTTP=$WEB_CODE, xmage=$XMAGE_HEALTH)."
                exit 0
              fi
              echo "Tentativa $i/60: HTTP=$WEB_CODE, xmage=$XMAGE_HEALTH..."
              sleep 5
            done

            echo "::error::Timeout aguardando play.sideboardy.app responder 200 e xmage ficar healthy."
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            exit 1
